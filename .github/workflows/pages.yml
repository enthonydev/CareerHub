name: Prévia do CareerHub no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        working-directory: frontend
        run: npm install
      - name: Compilar prévia com caminho do repositório
        working-directory: frontend
        run: npm run build -- --base=/CareerHub/
      - name: Conferir arquivos de publicação
        run: |
          test -s frontend/dist/index.html
          test -d frontend/dist/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
